<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Blood Moon Sigil — Belmont's Curse Wiki icon</title>
  <desc>Original gothic game-wiki icon: deep charcoal rounded-square field, faint antique-gold arch, large crimson gradient full moon disc with dark crack marks, white whip silhouette curving across the moon like a crescent, small antique-gold sparkle accents.</desc>
  <defs>
    <linearGradient id="moonGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#B22337"/>
      <stop offset="1" stop-color="#6E1F2A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C15C"/>
      <stop offset="1" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  <!-- dark charcoal rounded-square field (solid dark background per prompt) -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#14100F"/>
  <!-- faint antique-gold gothic arch -->
  <path d="M120 448 V 224 A 136 136 0 0 1 392 224 V 448"
        fill="none" stroke="#C9A227" stroke-opacity="0.16" stroke-width="18"/>
  <!-- large crimson gradient full moon disc -->
  <circle cx="256" cy="248" r="168" fill="url(#moonGrad)"/>
  <!-- crack marks across the moon -->
  <path d="M256 96 L 268 168 L 240 216 L 262 268 L 246 316 L 268 392"
        fill="none" stroke="#2B1B1E" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M268 168 L 322 150" fill="none" stroke="#2B1B1E" stroke-width="11" stroke-linecap="round"/>
  <path d="M246 316 L 188 332" fill="none" stroke="#2B1B1E" stroke-width="11" stroke-linecap="round"/>
  <!-- antique gold outline glow ring on the moon -->
  <circle cx="256" cy="248" r="168" fill="none" stroke="url(#goldGrad)" stroke-opacity="0.55" stroke-width="10"/>
  <!-- white whip silhouette curving like a crescent across the moon -->
  <path d="M112 320 C 128 216 208 160 268 168 C 340 177 392 232 384 304 C 378 360 336 388 300 380"
        fill="none" stroke="#F5EFE4" stroke-width="30" stroke-linecap="round"/>
  <!-- whip handle -->
  <line x1="112" y1="320" x2="86" y2="360" stroke="#F5EFE4" stroke-width="26" stroke-linecap="round"/>
  <!-- antique gold sparkle accents -->
  <circle cx="352" cy="140" r="14" fill="url(#goldGrad)"/>
  <circle cx="160" cy="368" r="9" fill="url(#goldGrad)"/>
  <circle cx="386" cy="216" r="7" fill="url(#goldGrad)"/>
</svg>
